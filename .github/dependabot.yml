version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    ignore:
      # The toolchain image is deliberately pinned to the MINIMUM supported PHP (8.3, see composer.json) so CI proves
      # the floor. Moving the supported range is a maintainer decision made together with composer.json, not a bot bump.
      - dependency-name: php
