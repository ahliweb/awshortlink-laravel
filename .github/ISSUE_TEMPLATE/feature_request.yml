name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: security
    attributes:
      label: Security & privacy considerations
      description: New personal data? New outbound requests? Authorisation or RLS impact?
