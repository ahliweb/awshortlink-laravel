openapi: 3.1.0
info:
  title: AW Shortlink Management & Service API (Specification v1.1.0-draft)
  version: 1.1.0-draft
  summary: Contract-first OpenAPI 3.1 specification for AW Shortlink
  description: >
    Authoritative REST contract for AW Shortlink (Workflow Step 8 / SPEC-08).
    In P0 (DES-015), these contracts back Filament 5 Actions, contract tests,
    and the contract-driven mock server (`design/mock-server/server.mjs`).
    External scoped API tokens ship in P1 (#30).
    Public redirect `GET|HEAD /buka/{slug}`, public landing `/buka/`, and
    rate-limited misuse report `POST /buka/laporan` are web gateway routes
    documented in `x-non-api-routes`.
x-non-api-routes:
  - path: /buka/{slug}
    methods: [GET, HEAD]
    ui: UI-009
    algorithm: ALG-003
    description: Stateless public redirect resolver (302 Found / 404 Not Found / 410 Gone / 405 / 503)
  - path: /buka/
    methods: [GET]
    ui: UI-009
    description: Public institutional landing page and verified public directory
  - path: /buka/laporan
    methods: [POST]
    ui: UI-009
    description: Rate-limited CSRF-protected public misuse report form (P1 #34)
servers:
  - url: https://links.example.org/buka/api/v1
    description: Production target path (pending HOST-01..17 verification)
  - url: http://127.0.0.1:4010/buka/api/v1
    description: Local contract-driven mock server (design/mock-server/server.mjs)
security:
  - bearerAuth: []
tags:
  - name: Links
    description: Short link catalog, slug check, and destination version history
  - name: Workflow
    description: Submission, destination validation, review queue, approval, and suspension
  - name: QR
    description: Deterministic SVG/PNG QR generation
  - name: Analytics
    description: Privacy-preserving aggregate click analytics with k=10 cohort suppression
  - name: Campaigns
    description: Campaign grouping and CSV bulk operations (P1)
  - name: Audit
    description: Hash-chained append-only audit log and chain verification
  - name: Identity
    description: Managed users, organizational units, closure hierarchy, and memberships
  - name: AccessPolicy
    description: Managed RBAC roles, permission matrix, scoped assignments, ABAC policies, and Effective Access Inspector
  - name: Workspace
    description: Authenticated user self-service profile, grants, MFA, and sessions
  - name: Ops
    description: System, PostgreSQL RLS, and scheduler health diagnostics
paths:
  /links:
    get:
      tags: [Links]
      x-api-id: API-001
      operationId: listLinks
      summary: List links scoped to the actor unit
      x-permission: links.list_internal
      x-ui-screens: [UI-001, UI-002]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [draft, submitted, active, suspended, expired, archived] }
        - name: unitId
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Cursor-paginated links accessible to caller
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Link' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
              example:
                data:
                  - id: "0192e5a0-1111-7000-8000-000000000001"
                    namespace: "buka"
                    slug: "event62"
                    title: "Event 62 guide"
                    destinationHost: "links.example.org"
                    currentDestinationUrl: "https://links.example.org/informasi/event-62"
                    riskClass: "low"
                    unitId: "0192e5a0-0001-7000-8000-000000000001"
                    status: "active"
                    version: 2
                    publishedAt: "2026-10-31T01:00:00Z"
                    expiresAt: null
                meta:
                  nextCursor: null
                  limit: 25
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Links]
      x-api-id: API-002
      operationId: createLink
      summary: Create draft link and reserve slug; never publishes automatically
      x-permission: links.create_draft
      x-ui-screens: [UI-003]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLink' }
      responses:
        '201':
          description: Draft link created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
              example:
                id: "0192e5a0-1111-7000-8000-000000000002"
                namespace: "buka"
                slug: "skm"
                title: "Survei Kepuasan Masyarakat @@ORG_SHORT@@"
                destinationHost: "links.example.org"
                currentDestinationUrl: null
                riskClass: "low"
                unitId: "0192e5a0-0001-7000-8000-000000000001"
                status: "draft"
                version: 1
                publishedAt: null
                expiresAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /links/check-slug:
    post:
      tags: [Links]
      x-api-id: API-003
      operationId: checkSlugAvailability
      summary: Canonicalize candidate slug (ALG-001) and check reserved_slugs / active links
      x-permission: links.create_draft
      x-ui-screens: [UI-003]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: Slug canonicalization and availability result
          content:
            application/json:
              schema:
                type: object
                required: [canonicalSlug, available, reasonCode]
                properties:
                  canonicalSlug: { type: [string, 'null'] }
                  available: { type: boolean }
                  reasonCode: { type: string, enum: [AVAILABLE, RESERVED_SYSTEM, RESERVED_PUBLISHED_TOMBSTONE, IN_USE, INVALID_FORMAT] }
              example:
                canonicalSlug: "campaign"
                available: true
                reasonCode: "AVAILABLE"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /destinations/validate:
    post:
      tags: [Workflow]
      x-api-id: API-004
      operationId: validateDestination
      summary: Server-authoritative URL canonicalization and risk classification (ALG-002, zero network I/O)
      x-permission: destinations.propose
      x-ui-screens: [UI-003, UI-007]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, maxLength: 2048 }
      responses:
        '200':
          description: Canonical URL and risk policy verdict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DestinationVerdict' }
              example:
                valid: true
                canonicalUrl: "https://links.example.org/informasi/event-62"
                canonicalHost: "links.example.org"
                riskClass: "low"
                requiresIndependentApproval: false
                reasonCodes: ["INSTITUTIONAL_ALLOWLIST"]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /links/{id}:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    get:
      tags: [Links]
      x-api-id: API-005
      operationId: getLink
      summary: Get scoped link detail
      x-permission: links.list_internal
      x-ui-screens: [UI-003, UI-004]
      responses:
        '200':
          description: Scoped link detail with current ETag
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
              example:
                id: "0192e5a0-1111-7000-8000-000000000001"
                namespace: "buka"
                slug: "event62"
                title: "Event 62 guide"
                destinationHost: "links.example.org"
                currentDestinationUrl: "https://links.example.org/informasi/event-62"
                riskClass: "low"
                unitId: "0192e5a0-0001-7000-8000-000000000001"
                status: "active"
                version: 2
                publishedAt: "2026-10-31T01:00:00Z"
                expiresAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Links]
      x-api-id: API-006
      operationId: updateLinkDraft
      summary: Update link metadata or draft settings with optimistic concurrency
      x-permission: links.update_draft
      x-ui-screens: [UI-003]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLink' }
      responses:
        '200':
          description: Updated link version
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
              example:
                id: "0192e5a0-1111-7000-8000-000000000001"
                namespace: "buka"
                slug: "event62"
                title: "Event 62 guide (Diperbarui)"
                destinationHost: "links.example.org"
                currentDestinationUrl: "https://links.example.org/informasi/event-62"
                riskClass: "low"
                unitId: "0192e5a0-0001-7000-8000-000000000001"
                status: "active"
                version: 3
                publishedAt: "2026-10-31T01:00:00Z"
                expiresAt: null
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /links/{id}/destinations:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    get:
      tags: [Links]
      x-api-id: API-007
      operationId: listLinkDestinations
      summary: List immutable destination versions for a link
      x-permission: destinations.view_history
      x-ui-screens: [UI-004, UI-007]
      responses:
        '200':
          description: Ordered destination revision history
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LinkDestination' }
              example:
                data:
                  - id: "0192e5a0-2222-7000-8000-000000000001"
                    linkId: "0192e5a0-1111-7000-8000-000000000001"
                    version: 1
                    urlCanonical: "https://links.example.org/informasi/event-62"
                    hostCanonical: "links.example.org"
                    riskClass: "low"
                    status: "current"
                    proposedBy: "0192e5a0-0002-7000-8000-000000000002"
                    approvedBy: "0192e5a0-0002-7000-8000-000000000003"
                    createdAt: "2026-10-31T00:30:00Z"
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Links]
      x-api-id: API-008
      operationId: proposeDestination
      summary: Propose a new destination version v(n+1) while keeping current version live
      x-permission: destinations.propose
      x-ui-screens: [UI-003, UI-004]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinationUrl, reason]
              properties:
                destinationUrl: { type: string, format: uri, maxLength: 2048 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201':
          description: Proposed destination revision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkDestination' }
              example:
                id: "0192e5a0-2222-7000-8000-000000000002"
                linkId: "0192e5a0-1111-7000-8000-000000000001"
                version: 2
                urlCanonical: "https://links.example.org/informasi/event-62-buku-panduan"
                hostCanonical: "links.example.org"
                riskClass: "low"
                status: "proposed"
                proposedBy: "0192e5a0-0002-7000-8000-000000000002"
                approvedBy: null
                createdAt: "2026-10-31T02:00:00Z"
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /links/{id}/destinations/{versionId}/rollback:
    parameters:
      - $ref: '#/components/parameters/LinkId'
      - name: versionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Links]
      x-api-id: API-009
      operationId: rollbackLinkDestination
      summary: Atomically revert current_destination_id to a previously approved destination version
      x-permission: destinations.rollback
      x-ui-screens: [UI-004]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Pointer swapped back to approved destination version with new audit entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
              example:
                id: "0192e5a0-1111-7000-8000-000000000001"
                namespace: "buka"
                slug: "event62"
                title: "Event 62 guide"
                destinationHost: "links.example.org"
                currentDestinationUrl: "https://links.example.org/informasi/event-62"
                riskClass: "low"
                unitId: "0192e5a0-0001-7000-8000-000000000001"
                status: "active"
                version: 4
                publishedAt: "2026-10-31T01:00:00Z"
                expiresAt: null
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /links/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      tags: [Workflow]
      x-api-id: API-010
      operationId: submitLink
      summary: Submit draft or proposed destination version for approval
      x-permission: links.submit
      x-ui-screens: [UI-003, UI-004]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Submission recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowReceipt' }
              example:
                status: "submitted"
                version: 2
                auditEventId: 10042
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /links/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      tags: [Workflow]
      x-api-id: API-011
      operationId: approveLink
      summary: Approve submitted destination and publish/swap active pointer (enforces POL-LINK-SOD)
      x-permission: links.approve
      x-ui-screens: [UI-004, UI-007]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, reason]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Link approved, slug permanently reserved, and destination pointer updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowReceipt' }
              example:
                status: "active"
                version: 3
                auditEventId: 10043
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /links/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      tags: [Workflow]
      x-api-id: API-012
      operationId: rejectLink
      summary: Reject submitted draft or proposed destination version with reviewer reason
      x-permission: links.reject
      x-ui-screens: [UI-004, UI-007]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Proposal rejected and returned to draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowReceipt' }
              example:
                status: "draft"
                version: 3
                auditEventId: 10044
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /links/{id}/suspend:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      tags: [Workflow]
      x-api-id: API-013
      operationId: suspendLink
      summary: Immediately suspend link on authoritative resolver reads (returns HTTP 404 to public per DES-003)
      x-permission: links.suspend
      x-ui-screens: [UI-004, UI-007]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Link suspended immediately
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowReceipt' }
              example:
                status: "suspended"
                version: 4
                auditEventId: 10045
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /links/{id}/reinstate:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      tags: [Workflow]
      x-api-id: API-014
      operationId: reinstateLink
      summary: Reinstate a suspended or expired link after review
      x-permission: links.reinstate
      x-ui-screens: [UI-004, UI-007]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                expiresAt: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: Link reinstated to active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowReceipt' }
              example:
                status: "active"
                version: 5
                auditEventId: 10046
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /links/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      tags: [Workflow]
      x-api-id: API-015
      operationId: archiveLink
      summary: Permanently archive link (public receives 410 Gone; slug remains permanently reserved)
      x-permission: links.archive
      x-ui-screens: [UI-002, UI-004]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                retiredPublicMessage: { type: boolean, default: true }
      responses:
        '200':
          description: Link archived with permanent slug tombstone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowReceipt' }
              example:
                status: "archived"
                version: 6
                auditEventId: 10047
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /reviews/pending:
    get:
      tags: [Workflow]
      x-api-id: API-016
      operationId: listPendingReviews
      summary: List pending link/destination approvals in caller scope (P1 #27)
      x-permission: links.approve
      x-ui-screens: [UI-001, UI-007]
      responses:
        '200':
          description: Scoped pending review items with SoD flags
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [linkId, slug, unitId, proposedUrl, riskClass, authoredBy, selfApprovalBlocked]
                      properties:
                        linkId: { type: string, format: uuid }
                        slug: { type: string }
                        unitId: { type: string, format: uuid }
                        proposedUrl: { type: string, format: uri }
                        riskClass: { type: string, enum: [low, medium, high] }
                        authoredBy: { type: string, format: uuid }
                        selfApprovalBlocked: { type: boolean }
              example:
                data:
                  - linkId: "0192e5a0-1111-7000-8000-000000000009"
                    slug: "materi-pelatihan"
                    unitId: "0192e5a0-0001-7000-8000-000000000001"
                    proposedUrl: "https://pelatihan.portal.example.go.id/modul-2026"
                    riskClass: "medium"
                    authoredBy: "0192e5a0-0002-7000-8000-000000000002"
                    selfApprovalBlocked: false
        '403': { $ref: '#/components/responses/Forbidden' }
  /links/{id}/qr:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    get:
      tags: [QR]
      x-api-id: API-017
      operationId: downloadLinkQr
      summary: Generate deterministic SVG/PNG QR encoding only the canonical /buka/{slug} URL
      x-permission: qr.generate_public
      x-ui-screens: [UI-004, UI-005]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [svg, png], default: svg }
        - name: size
          in: query
          schema: { type: integer, enum: [256, 512, 1024], default: 512 }
      responses:
        '200':
          description: Safe machine-readable QR image of canonical short URL
          content:
            image/svg+xml:
              schema: { type: string }
              example: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\"><title>QR /buka/event62</title></svg>"
            image/png:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /analytics/overview:
    get:
      tags: [Analytics]
      x-api-id: API-018
      operationId: getAnalyticsOverview
      summary: Unit/date aggregate click overview with k=10 small-cohort suppression (DES-005)
      x-permission: analytics.view
      x-ui-screens: [UI-001, UI-006]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: unitId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Aggregate overview with suppression metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsOverview' }
              example:
                validClicks: 1420
                suspectedBots: 185
                totalRequests: 1605
                cohortSuppressionThreshold: 10
                dataGapCount: 0
                asOf: "2026-10-31T08:00:00Z"
                dailySeries:
                  - dateUtc: "2026-10-30"
                    validClicksDisplay: "710"
                    suspectedBotsDisplay: "90"
                    suppressed: false
                  - dateUtc: "2026-10-31"
                    validClicksDisplay: "<10"
                    suspectedBotsDisplay: "0"
                    suppressed: true
        '403': { $ref: '#/components/responses/Forbidden' }
  /links/{id}/analytics:
    parameters:
