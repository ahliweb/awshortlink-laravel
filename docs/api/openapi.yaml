components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session-bound internal CSRF/auth context in P0 (DES-015) or SHA-256 hashed scoped API credential in P1 (#30).
  headers:
    ETag:
      description: Optimistic concurrency version tag (`"v{version}"`)
      schema: { type: string, example: "\"v2\"" }
  parameters:
    LinkId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Expected aggregate version tag (`"v{version}"`); mismatch returns 409 Conflict, omission returns 428
      schema: { type: string, example: "\"v1\"" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID for safe 24h idempotent retries on POST mutations
      schema: { type: string, format: uuid }
  schemas:
    Link:
      type: object
      required: [id, namespace, slug, title, unitId, status, version]
      properties:
        id: { type: string, format: uuid }
        namespace: { type: string, default: "buka" }
        slug: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{1,62}[a-z0-9])$' }
        title: { type: string, minLength: 3, maxLength: 160 }
        destinationHost: { type: [string, 'null'] }
        currentDestinationUrl: { type: [string, 'null'], format: uri }
        riskClass: { type: [string, 'null'], enum: [low, medium, high, null] }
        unitId: { type: string, format: uuid }
        status: { type: string, enum: [draft, submitted, active, suspended, expired, archived] }
        version: { type: integer, minimum: 1 }
        publishedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
    CreateLink:
      type: object
      required: [slug, title, destinationUrl, unitId]
      properties:
        slug: { type: string, minLength: 3, maxLength: 64 }
        title: { type: string, minLength: 3, maxLength: 160 }
        destinationUrl: { type: string, format: uri, maxLength: 2048 }
        unitId: { type: string, format: uuid }
        campaignId: { type: [string, 'null'], format: uuid }
        expiresAt: { type: [string, 'null'], format: date-time }
    UpdateLink:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 160 }
        campaignId: { type: [string, 'null'], format: uuid }
        expiresAt: { type: [string, 'null'], format: date-time }
    LinkDestination:
      type: object
      required: [id, linkId, version, urlCanonical, hostCanonical, riskClass, status, proposedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        linkId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        urlCanonical: { type: string, format: uri }
        hostCanonical: { type: string }
        riskClass: { type: string, enum: [low, medium, high, forbidden] }
        status: { type: string, enum: [proposed, blocked, pending_review, approved, rejected, current, superseded] }
        proposedBy: { type: string, format: uuid }
        approvedBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    DestinationVerdict:
      type: object
      required: [valid, canonicalUrl, canonicalHost, riskClass, requiresIndependentApproval, reasonCodes]
      properties:
        valid: { type: boolean }
        canonicalUrl: { type: [string, 'null'], format: uri }
        canonicalHost: { type: [string, 'null'] }
        riskClass: { type: string, enum: [low, medium, high, forbidden] }
        requiresIndependentApproval: { type: boolean }
        reasonCodes:
          type: array
          items: { type: string }
    WorkflowReceipt:
      type: object
      required: [status, version, auditEventId]
      properties:
        status: { type: string }
        version: { type: integer }
        auditEventId: { type: integer }
    AnalyticsOverview:
      type: object
      required: [validClicks, suspectedBots, totalRequests, cohortSuppressionThreshold, dataGapCount, asOf, dailySeries]
      properties:
        validClicks: { type: integer, minimum: 0 }
        suspectedBots: { type: integer, minimum: 0 }
        totalRequests: { type: integer, minimum: 0 }
        cohortSuppressionThreshold: { type: integer, const: 10 }
        dataGapCount: { type: integer, minimum: 0 }
        asOf: { type: string, format: date-time }
        dailySeries:
          type: array
          items:
            type: object
            required: [dateUtc, validClicksDisplay, suspectedBotsDisplay, suppressed]
            properties:
              dateUtc: { type: string, format: date }
              validClicksDisplay: { type: string }
              suspectedBotsDisplay: { type: string }
              suppressed: { type: boolean }
    Campaign:
      type: object
      required: [id, unitId, code, name, status]
      properties:
        id: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [planned, running, ended] }
    AuditEvent:
      type: object
      required: [id, action, subjectType, occurredAt, prevHash, rowHash]
      properties:
        id: { type: integer }
        unitId: { type: [string, 'null'], format: uuid }
        linkId: { type: [string, 'null'], format: uuid }
        actorId: { type: [string, 'null'], format: uuid }
        action: { type: string }
        subjectType: { type: string }
        subjectVersion: { type: [integer, 'null'] }
        reason: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
        prevHash: { type: string }
        rowHash: { type: string }
    Unit:
      type: object
      required: [id, code, name, status, depth, version]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }
        depth: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
    UnitMembership:
      type: object
      required: [id, userId, unitId, status, validFrom]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        status: { type: string, enum: [active, revoked] }
        validFrom: { type: string, format: date-time }
        validUntil: { type: [string, 'null'], format: date-time }
    ManagedUser:
      type: object
      required: [id, name, email, status, mfaEnrolled, isProtectedOwner, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [invited, active, suspended, disabled] }
        mfaEnrolled: { type: boolean }
        isProtectedOwner: { type: boolean }
        version: { type: integer, minimum: 1 }
    ManagedRole:
      type: object
      required: [id, key, label, isProtected, sensitivity, status, version]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        label: { type: string }
        isProtected: { type: boolean }
        sensitivity: { type: string, enum: [normal, sensitive, protected] }
        status: { type: string, enum: [active, inactive] }
        version: { type: integer, minimum: 1 }
    RoleAssignment:
      type: object
      required: [id, userId, roleKey, scopeType, validFrom, status]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        roleKey: { type: string }
        scopeType: { type: string, enum: [global, unit, unit_descendants, owned] }
        unitId: { type: [string, 'null'], format: uuid }
        validFrom: { type: string, format: date-time }
        validUntil: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [requested, active, expired, revoked, denied] }
    AccessChangeRequest:
      type: object
      required: [id, requestedBy, targetUserId, roleKey, scopeType, status, reason]
      properties:
        id: { type: string, format: uuid }
        requestedBy: { type: string, format: uuid }
        targetUserId: { type: string, format: uuid }
        roleKey: { type: string }
        scopeType: { type: string, enum: [global, unit, unit_descendants, owned] }
        unitId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [pending, approved, denied] }
        reason: { type: string }
    AbacPolicy:
      type: object
      required: [id, key, resource, action, activeVersion, status, checksum]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        resource: { type: string }
        action: { type: string }
        activeVersion: { type: integer }
        status: { type: string, enum: [draft, simulated, submitted, approved, active, superseded, rejected, revoked] }
        checksum: { type: string }
    CursorMeta:
      type: object
      required: [nextCursor, limit]
      properties:
        nextCursor: { type: [string, 'null'] }
        limit: { type: integer }
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs
      required: [type, title, status, code, detail, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
  responses:
    Unauthorized:
      description: Authentication required or session/token expired
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://links.example.org/buka/problems/unauthorized"
            title: "Autentikasi Diperlukan"
            status: 401
            code: "UNAUTHENTICATED"
            detail: "Sesi atau kredensial API tidak valid atau telah berakhir."
            requestId: "0192e5a0-9999-7000-8000-000000000401"
    Forbidden:
      description: Denied by RBAC, ABAC policy, delegation ceiling, or step-up MFA check
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://links.example.org/buka/problems/forbidden"
            title: "Akses Ditolak"
            status: 403
            code: "ACCESS_DENIED"
            detail: "Peran atau kebijakan ABAC aktif tidak mengizinkan aksi ini."
            requestId: "0192e5a0-9999-7000-8000-000000000403"
    NotFound:
      description: Resource not found or concealed by unit RLS boundary (no cross-unit existence leakage)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://links.example.org/buka/problems/not-found"
            title: "Sumber Daya Tidak Ditemukan"
            status: 404
            code: "RESOURCE_NOT_FOUND"
            detail: "Data tidak ditemukan atau berada di luar cakupan unit Anda."
            requestId: "0192e5a0-9999-7000-8000-000000000404"
    Conflict:
      description: Optimistic concurrency version mismatch (`If-Match`), duplicate/reserved slug, or invalid state transition
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://links.example.org/buka/problems/conflict"
            title: "Konflik Versi atau Status"
            status: 409
            code: "STALE_VERSION"
            detail: "Versi sumber daya telah berubah. Muat ulang data terbaru sebelum menyimpan."
            requestId: "0192e5a0-9999-7000-8000-000000000409"
    Validation:
      description: Input validation failure or forbidden destination URL policy verdict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://links.example.org/buka/problems/validation"
            title: "Input Tidak Valid"
            status: 422
            code: "DESTINATION_POLICY_VIOLATION"
            detail: "URL tujuan melanggar kebijakan keamanan (wajib HTTPS dan tanpa parameter sensitif)."
            requestId: "0192e5a0-9999-7000-8000-000000000422"
    PreconditionRequired:
      description: Missing mandatory `If-Match` header on state-mutating request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: "https://links.example.org/buka/problems/precondition-required"
            title: "Header If-Match Diperlukan"
            status: 428
            code: "PRECONDITION_REQUIRED"
            detail: "Sertakan header If-Match dengan ETag versi saat ini."
            requestId: "0192e5a0-9999-7000-8000-000000000428"
